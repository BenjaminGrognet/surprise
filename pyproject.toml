[project]
name = "surprise"
version = "0.1.0"
description = "Collecte d'activités de couple originales à Paris"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surprise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
