<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votre soirée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/client.css">
</head>
<body>
<main>
  <img class="banner" src="https://images.unsplash.com/photo-1770743798589-f41ac6e65078?auto=format&fit=crop&w=1600&q=60" alt="" loading="lazy" decoding="async">
  <div id="account-nav" class="account-nav"></div>
  <a class="brand" href="/">Surprise · votre soirée</a>
  <section id="screen" aria-live="polite"></section>
</main>
<script src="/client.js"></script>
<script src="/account.js"></script>
<script>
// One evening, apart from the questionnaire: up to MAX wishes, an occasion, a day.
// With a remembered profile, its refusals, budget, audace and tastes apply; without, default ones.
const state = {
  envies: [], occasions: [], starts: [], ends: [], budgets: [], max: 3, profile: null,
  night: { envies: [], diner: null, decoucher: false, occasion: null, start: null, end: null, budget: null, day: nextFriday() },
};
const MEALS = [
  { value: true, label: "Oui, on dîne pendant la soirée", emoji: "🍽️" },
  { value: false, label: "Non, on aura déjà mangé", emoji: "✅" },
];
const NIGHTS = [
  { value: false, label: "On rentre chez nous", emoji: "🏠" },
  { value: true, label: "On découche : une nuit dans un hôtel ou une love room", emoji: "🛏️" },
];

function render() {
  const { night, profile: p } = state;
  const status = h("div", { id: "status" });
  const envies = h("div", { class: "options", role: "group", "aria-labelledby": "q-title" },
    state.envies.map((o) => {
      const chosen = night.envies.includes(o.value);
      return h("button", {
        class: "option", "aria-pressed": String(chosen), disabled: !chosen && night.envies.length >= state.max,
        onclick: () => { night.envies = chosen ? night.envies.filter((v) => v !== o.value) : [...night.envies, o.value]; render(); },
      }, choiceContent(o));
    }));
  const meals = h("div", { class: "options", role: "group", "aria-labelledby": "meal-title" },
    MEALS.map((o) => h("button", {
      class: "option", "aria-pressed": String(night.diner === o.value),
      onclick: () => { night.diner = o.value; render(); },
    }, choiceContent(o))));
  const nights = h("div", { class: "options", role: "group", "aria-labelledby": "night-title" },
    NIGHTS.map((o) => h("button", {
      class: "option", "aria-pressed": String(night.decoucher === o.value),
      onclick: () => { night.decoucher = o.value; render(); },
    }, choiceContent(o))));
  const occasions = h("div", { class: "chips", role: "group", "aria-label": "Une occasion ?" },
    state.occasions.map((o) => h("button", {
      class: "option", "aria-pressed": String(night.occasion === o.value),
      onclick: () => { night.occasion = night.occasion === o.value ? null : o.value; render(); },
    }, choiceContent(o))));
  const starts = h("div", { class: "chips", role: "group", "aria-label": "Et pour commencer ?" },
    state.starts.map((o) => h("button", {
      class: "option", "aria-pressed": String(night.start === o.value),
      onclick: () => { night.start = night.start === o.value ? null : o.value; render(); },
    }, choiceContent(o))));
  const ends = h("div", { class: "chips", role: "group", "aria-label": "Et pour finir ?" },
    state.ends.map((o) => h("button", {
      class: "option", "aria-pressed": String(night.end === o.value),
      onclick: () => { night.end = night.end === o.value ? null : o.value; render(); },
    }, choiceContent(o))));
  const budgets = h("div", { class: "chips", role: "group", "aria-label": "Et le budget, pour cette soirée ?" },
    state.budgets.map((o) => h("button", {
      class: "option", "aria-pressed": String(night.budget === o.budget),
      onclick: () => { night.budget = night.budget === o.budget ? null : o.budget; render(); },
    }, choiceContent(o))));
  $("screen").replaceChildren(
    p
      ? h("p", { class: "profile-line" }, h("strong", {}, p.names || p.persona.name), p.names ? ` · ${p.persona.name}` : "",
          " — vos « jamais », votre budget et vos goûts s'appliquent. ", h("a", { href: "/profil" }, "Voir le profil"))
      : h("p", { class: "profile-line" }, "Sans profil, on compose avec des réglages par défaut. ", h("a", { href: "/profil" }, "Faire le quiz")),
    h("h1", { id: "q-title" }, "Ce soir, envie de quoi ?"),
    h("p", { class: "hint" }, `Jusqu'à ${state.max} envies, on les mêle dans la soirée.`),
    h("p", { class: "count" }, `${night.envies.length} sur ${state.max}`),
    envies,
    h("h2", { class: "sub", id: "meal-title" }, "Et pour manger ?"),
    meals,
    h("h2", { class: "sub", id: "night-title" }, "Et après ?"),
    nights,
    h("h2", { class: "sub" }, "Et pour commencer ?"),
    h("p", { class: "hint" }, "Sans choix : l'heure habituelle, ou plus tôt si une envie le demande."),
    starts,
    h("h2", { class: "sub" }, "Et pour finir ?"),
    h("p", { class: "hint" }, "Sans choix : ce que vos envies demandent, ou minuit et demi."),
    ends,
    h("h2", { class: "sub" }, "Et le budget, pour cette soirée ?"),
    h("p", { class: "hint" }, p ? "Sans choix : le budget habituel de votre profil." : "Sans choix : 120 €."),
    budgets,
    h("h2", { class: "sub" }, "Une occasion ?"),
    occasions,
    dayField("night-day", night.day, (value) => { night.day = value; }),
    h("nav", {},
      h("span"),
      h("button", { class: "primary", disabled: !night.envies.length || night.diner === null || !night.day, onclick: () => compose(status) }, "Composer notre soirée")),
    status,
  );
}

async function compose(status) {
  const { night } = state;
  status.replaceChildren(h("div", { class: "loading" }, h("div", { class: "spinner" }), `On vérifie les disponibilités et on compose votre soirée du ${longDay(night.day)}… (une minute environ)`));
  try {
    const body = JSON.stringify({ ...night, profile: state.profile || null });
    const r = await fetch("/api/soirees", { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (!r.ok) throw new Error(r.status);
    const { url } = await r.json();
    window.location.href = url;
  } catch (e) {
    status.replaceChildren(h("p", { class: "error" }, "La composition a échoué. Réessayez dans un instant."));
  }
}

(async () => {
  renderAccountNav($("account-nav"));
  const data = await (await fetch("/api/soiree")).json();
  Object.assign(state, { envies: data.envies, occasions: data.occasions, max: data.max, starts: data.starts, ends: data.ends, budgets: data.budgets });
  const remembered = rememberedProfile();
  if (remembered) {
    state.profile = remembered.profile;
    const first = state.profile.first_day;
    if (first && first >= isoDay(new Date())) state.night.day = first;
  }
  render();
})();
</script>
</body>
</html>
