<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votre profil de couple</title>
<link rel="stylesheet" href="/client.css">
</head>
<body>
<main>
  <p class="brand">Surprise · votre profil de couple</p>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  <section id="screen" aria-live="polite"></section>
</main>
<script src="/client.js"></script>
<script>
const state = { questions: [], vibes: {}, index: 0, answers: {} };

function answered(q) {
  const a = state.answers[q.id];
  if (q.kind === "multi" || q.kind === "text") return true;  // "none" is an answer
  if (q.kind === "date") return !!a;
  return a != null;
}

function render() {
  const q = state.questions[state.index];
  $("bar").style.width = `${(state.index / state.questions.length) * 100}%`;
  if (!q) return renderProfile();
  const screen = $("screen");
  screen.replaceChildren(
    h("p", { class: "step-count" }, `Question ${state.index + 1} sur ${state.questions.length}`),
    h("h1", { id: "q-title" }, q.question),
    q.hint && h("p", { class: "hint" }, q.hint),
    body(q),
    h("nav", {},
      state.index > 0 ? h("button", { class: "link", onclick: () => { state.index--; render(); } }, "← Retour") : h("span"),
      q.kind !== "single" && q.kind !== "scale" && h("button", { class: "primary", disabled: !answered(q), onclick: next }, "Suivant")),
  );
  screen.querySelector(".option, input")?.focus({ preventScroll: true });
}

function next() { state.index++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

function body(q) {
  const current = state.answers[q.id];
  if (q.kind === "single" || q.kind === "scale") {
    return h("div", { class: q.kind === "scale" ? "scale" : "options", role: "group", "aria-labelledby": "q-title" },
      q.options.map((o) => h("button", {
        class: "option", "aria-pressed": String(current === o.value),
        onclick: () => { state.answers[q.id] = o.value; setTimeout(next, 150); render(); },
      }, q.kind === "scale" ? [h("span", { class: "emoji", "aria-hidden": "true" }, o.emoji), h("small", {}, o.label || String(o.value))] : choiceContent(o))));
  }
  if (q.kind === "multi") {
    const chosen = new Set(current || []);
    return h("div", { class: "options", role: "group", "aria-labelledby": "q-title" },
      q.options.map((o) => h("button", {
        class: "option", "aria-pressed": String(chosen.has(o.value)),
        onclick: () => {
          if (chosen.has(o.value)) chosen.delete(o.value);
          else if (!q.max || chosen.size < q.max) chosen.add(o.value);
          state.answers[q.id] = [...chosen]; render();
        },
      }, choiceContent(o))));
  }
  if (q.kind === "date") {
    state.answers[q.id] ||= nextFriday();
    return dayField("day", state.answers[q.id], (value) => { state.answers[q.id] = value; });
  }
  return h("div", { class: "field" },
    h("input", { type: "text", id: "names", placeholder: "Léa & Sam", maxlength: 80, value: current || "", "aria-labelledby": "q-title",
      oninput: (e) => { state.answers[q.id] = e.target.value; } }));
}

async function renderProfile() {
  const screen = $("screen");
  screen.replaceChildren(h("div", { class: "loading" }, h("div", { class: "spinner" }), "On dessine votre profil…"));
  let saved;
  try {
    const r = await fetch("/api/profiles", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers: state.answers }) });
    if (!r.ok) throw new Error(r.status);
    saved = await r.json();
  } catch (e) {
    screen.replaceChildren(h("p", { class: "error" }, "Le profil n'a pas pu être enregistré. Réessayez."), h("button", { class: "primary", onclick: renderProfile }, "Réessayer"));
    return;
  }
  history.replaceState(null, "", `#p=${saved.id}`);
  showProfile(saved.id, saved.profile);
}

const ENDS = { "23:30": "avant minuit", "00:30": "sur un dernier verre", "03:30": "au bout de la nuit" };

function showProfile(id, p) {
  $("bar").style.width = "100%";
  const eviter = state.questions.find((q) => q.id === "eviter");
  const never = (state.answers.eviter || []).map((v) => eviter?.options.find((o) => o.value === v)).filter(Boolean);
  $("screen").replaceChildren(
    h("div", { class: "persona" },
      h("p", { class: "eyebrow" }, p.names ? `${p.names}, vous êtes…` : "Vous êtes…"),
      h("h2", {}, p.persona.name),
      h("p", {}, p.persona.text),
      h("div", {}, p.vibes.map((v) => h("span", { class: "tag" }, state.vibes[v] || v))),
      h("ul", { class: "facts" },
        h("li", {}, h("strong", {}, p.first_day ? longDay(p.first_day) : "Bientôt"), "première sortie"),
        h("li", {}, h("strong", {}, `${p.budget >= 350 ? "sans compter" : `≈ ${p.budget} €`}`), "pour deux"),
        h("li", {}, h("strong", {}, ENDS[p.end] || p.end), "d'habitude"),
        h("li", {}, h("strong", {}, "Audace"), h("div", { class: "meter", role: "img", "aria-label": `${Math.round(p.audace * 100)} %` }, h("span", { style: `width:${p.audace * 100}%` }))),
      ),
      never.length > 0 && h("p", { class: "never" }, h("strong", {}, "Jamais : "), never.map((o) => o.label.toLowerCase()).join(", ")),
    ),
    h("nav", {},
      h("button", { class: "link", onclick: () => { state.index = 0; history.replaceState(null, "", "#"); render(); } }, "Recommencer"),
      h("a", { class: "primary", href: `/soiree#p=${id}` }, "Préparer une soirée")),
  );
}

(async () => {
  const data = await (await fetch("/api/quiz")).json();
  Object.assign(state, { questions: data.questions, vibes: data.vibes });
  const saved = location.hash.match(/p=([\w-]+)/);
  if (saved) {
    const r = await fetch(`/api/profiles/${saved[1]}`);
    if (r.ok) { const found = await r.json(); state.answers = found.answers; return showProfile(found.id, found.profile); }
  }
  render();
})();
</script>
</body>
</html>
