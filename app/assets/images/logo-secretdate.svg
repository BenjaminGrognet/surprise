<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0ad"/>
      <stop offset="18%" stop-color="#f7cf68"/>
      <stop offset="48%" stop-color="#c98b24"/>
      <stop offset="72%" stop-color="#f4ca5b"/>
      <stop offset="100%" stop-color="#8e5a12"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2b7"/>
      <stop offset="45%" stop-color="#d39a2f"/>
      <stop offset="100%" stop-color="#70420b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Transparent background: logo only -->
  <g filter="url(#shadow)" font-family="Noto Serif Display, Georgia, serif" font-weight="500">
    <!-- D, behind -->
    <text x="500" y="785"
          text-anchor="middle"
          font-size="720"
          fill="url(#gold)"
          stroke="#6d430d"
          stroke-width="8"
          paint-order="stroke">D</text>

    <!-- S, interlaced/front -->
    <text x="455" y="730"
          text-anchor="middle"
          font-size="720"
          fill="url(#gold)"
          stroke="#6d430d"
          stroke-width="8"
          paint-order="stroke">S</text>

    <!-- subtle highlight -->
    <text x="455" y="730"
          text-anchor="middle"
          font-size="720"
          fill="none"
          stroke="#fff1ad"
          stroke-opacity=".35"
          stroke-width="2">S</text>
  </g>
</svg>
